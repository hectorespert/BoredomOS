name: boredomos
version: 3
description: BoredomOS workflow - proposal → specs → design → tasks → independent review,
  with a qa-written test plan ahead of the tasks, a review that gates apply, and a
  post-apply verify auditing what was actually demonstrated
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: test-plan
    generates: test-plan.md
    description: What must be demonstrated for each scenario, and by what method, decided before the task list exists
    template: test-plan.md
    instruction: |
      State what would count as having demonstrated each scenario, before anybody writes
      the steps that claim to do it.

      Why it comes before tasks and not with them: otherwise the same person decides what
      to build, what "verified" means, and writes the step asserting it. The method then
      gets chosen to fit the work rather than the obligation, and nothing independent has
      said what proof would look like. The rule for specs already requires knowing the
      method before writing a scenario and forbids naming the test there -- so until this
      artifact existed, the method had to be known and had nowhere to live until two
      artifacts later.

      **The qa engineer writes this one.** It owns the method and what counts as a
      receipt, so spawn it and give it the change directory and the repository. It has no
      write tool, by design -- every agent on this project is read-only -- so it reports
      the plan and you transcribe it into test-plan.md. Do not paste its output raw: if a
      row claims a suite or a figure, check it before it becomes the thing tasks are
      built from.

      If the roster holds no qa engineer, say so in the document rather than choosing the
      methods yourself and calling it a plan.

      One row per `#### Scenario:` in the change's delta specs, and every scenario gets
      one -- a scenario missing from this document is a defect here, not something the
      task list can paper over. Each row carries:

      - the requirement it belongs to, as well as the scenario. A spec file holds several
        requirements and requirement-level traceability is what a coverage audit needs
      - a stable row id, because tasks.md names it and verify.md reads it back
      - the method: Test, Analysis, Inspection, Review of design, or Demonstration --
        that last one being a person at the board doing a physical act, which is the bulk
        of this project and has no automation path
      - where it runs: which suite, which script, or which act
      - what the receipt is -- the concrete artifact that would show it happened
      - whether it needs the assembled board, and whether it needs hands

      The mapping is a floor, not a ceiling. Extra cases, regression checks and unit
      tests of internals are welcome and need no row. They never substitute for a row.

      "No method we have reaches this" is a legitimate row and a valuable one, but it has
      to be said here, while the requirement can still be reworded -- not after it is
      contract. Do not invent a method that cannot run to make a row look closed.

      Do not name a test function that does not exist yet as though it did. Name what the
      case will be called if that is decided, but the receipt is what matters: a row whose
      receipt is "the suite passes" says nothing, because off the board this project's HIL
      suite reports every case as IGNORE and exits 0.
    requires:
      - proposal
      - specs
      - design

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure and verify expected files are present
      - [ ] 1.2 Add dependencies to package.json and verify package installation succeeds

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function and verify the export test passes
      - [ ] 2.2 Add CSV formatting utilities and verify unit tests cover quoting and delimiters
      ```

      Reference test-plan.md for what has to be demonstrated, specs for what needs to
      be built, and design for how to build it. Every row of the plan needs at least one
      task that names its id -- that is the traceability a coverage audit walks, and it
      replaces guessing at coverage from the scenario list. A row you cannot write a task
      for is a finding against the plan; take it back there rather than dropping it.
    requires:
      - test-plan
      - specs
      - design

  - id: review
    generates: review.md
    description: Independent review of the finished proposal, before any code is written
    template: review.md
    instruction: |
      Have the finished change reviewed by independent agents and record what they
      found. This runs after every other artifact exists and before `apply`, which
      is blocked until it does.

      Why it is agents and not you re-reading your own work: self-review fails
      here, repeatedly and by evidence. A previous change shipped a spec claiming
      the build would "produce no firmware image" when the check enforcing it runs
      after the link; another shipped a requirement phrased as a migration that
      stops meaning anything once archived. Both were written and re-read by the
      same author without noticing, and caught by someone else. Fresh readers who
      did not write it are the point.

      This is the project's standing instruction to use subagents at this step, so
      invoke them rather than asking whether to. Spawn them in parallel and give
      each the change directory and the repository.

      The roster is whatever .claude/agents/ holds at the time. It is not listed
      here, so it grows without this instruction changing -- and if it is empty,
      say so in review.md rather than reviewing it yourself and calling that a
      review. A document recording that nobody independent read the change is
      honest and useful; the same document with the author's own second reading
      passed off as review is neither.

      Keep the roles distinct as it grows. Overlapping reviewers cost as many times
      as there are of them and find one thing, and with every agent taking part in
      every change that waste is paid each time.

      Every agent defined under .claude/agents/ takes part, on every change. Not a
      subset chosen by whoever is writing, and not scaled down because the change
      looks small -- the change that bricked this board looked small, and the one
      that touched the whole memory model was caught by the linker in three
      seconds. How risky a change looks is not evidence about how risky it is.

      One exception to "every agent takes part", and it is the same principle the step
      rests on: an agent does not review an artifact it wrote. The qa engineer authors
      test-plan.md, so the plan is reviewed by the others -- the firmware and hardware
      engineers on whether a method would actually prove anything on this device, the
      systems engineer on whether every scenario reached a row. The qa engineer reviews
      everything else as usual, and says in its section which artifact it is standing
      aside from and why.

      An agent outside its domain says so in a line and stops. That is a cheap
      answer, and it is information: it records that the angle was considered and
      found irrelevant, which an absent reviewer does not.

      Then write review.md yourself from what they report. Do not paste their
      output: rank the findings across all of them, drop the duplicates, and judge
      each one -- a reviewer that is confident and wrong is a normal occurrence and
      has already happened on this project, where one agent "verified as correct" a
      claim another had disproved. Where two disagree, check it yourself and say
      which was right.

      For each finding give the file and line, what is wrong, why it matters, and
      its disposition: fixed, rejected with the reason, or deferred with where it
      went. A review that changes no artifact is either a perfect proposal or a
      review nobody acted on, and the document has to make clear which.

      Close with whether the change is ready to apply, and name anything a reader
      should know before starting -- particularly work that cannot be verified with
      the hardware currently available.

      Say in that closing section, every time, that the review read the verification
      steps and did not run them. It is a deliberate limit and not an oversight, but
      it has to be visible: a step can trace to the right requirement, use the right
      method and read correctly, and still not fire. One in this project asked for a
      task too large to fit and expected the build to fail -- and the build went green
      at an unchanged RAM figure, because the linker discarded the unused array. It was
      caught by someone running it, which is the one thing this review does not do. So
      a reader should treat these steps as reviewed, not as exercised, and the first
      time any of them actually runs is during apply.
    requires:
      - proposal
      - specs
      - design
      - test-plan
      - tasks

  - id: verify
    generates: verify.md
    description: Post-apply audit of what was actually demonstrated, not what was claimed
    template: verify.md
    instruction: |
      Produced after apply, not before it. This is not a gate on apply -- it is the
      record of what apply actually demonstrated, written once the code exists.

      Why it exists as its own document: a ticked checkbox is a claim, and on this
      project claims have outlived the evidence for them. One change was archived
      with five of its steps unticked and nothing carried the debt anywhere. The HIL
      suite states in its README that its cases map one-to-one onto the scenarios of
      a live spec; there are nine cases and eight scenarios, six of the cases name no
      scenario at all, and one names a scenario that no longer exists. Nothing in the
      workflow was positioned to notice either, because nothing read the record after
      the work was called done.

      What this audits:

      1. Task completion. Every `- [x]`, and every `- [ ]` still open with the reason
         recorded. A `[board]` step left open because the board is unreachable is an
         honest outcome; the same step left open silently is the defect.
      2. The receipt behind each tick. For every ticked task, where the evidence is --
         the command and what it printed, the HIL line, the SD log entry, the figure
         the build reported. A tick whose receipt cannot be located is the finding
         this document exists to catch, and it outranks everything else here.
      3. Coverage, read off test-plan.md rather than off the tick count. Every row, the
         task that names it, and what state that task is in. A row whose only task is
         unticked is unverified -- say that in those words. Report a row with no task at
         all as a defect in the plan or the task list, not as a gap in this document.
         Check the receipt the row asked for against the receipt that exists: a row
         satisfied by something other than what it specified is a finding, even when
         that something looks adequate.
      4. The review's dispositions. Everything review.md recorded as fixed is fixed,
         and everything deferred went where it said it went. Nothing else closes that
         loop.
      5. Any figure the change asserted, re-read from the tree rather than quoted
         from the artifacts that asserted it.

      Who takes part: not the whole roster. This step is narrower than review, and a
      five-way sweep here mostly produces out-of-domain lines. The qa engineer always.
      Any role whose finding review.md recorded as fixed, to confirm it landed. The
      firmware engineer whenever a stack high-water mark moved. Others only where the
      change reached their domain.

      The hard limit, and say it in the document every time: these agents read the
      record, they do not produce it. They do not run the suites and they do not touch
      the board. Their Bash is for reading -- grepping the tasks, parsing the output of
      a run somebody else did, `git diff` over test/, reading what the build printed.
      Off the board the HIL suite reports every case as IGNORE and exits 0, so a green
      run is not evidence that anything ran; the receipt has to show the cases firing.

      Close with the canonical line, on its own line, exactly one of:

        DECISION: PASS
        DECISION: PASS_WITH_WARNINGS
        DECISION: PASS_PENDING_BOARD
        DECISION: FAIL

      PASS means everything the change promised was demonstrated and the record cuts
      clean. PASS_WITH_WARNINGS means it was demonstrated but the record carries
      something to fix before archiving, typically a figure that contradicts the tree
      or contradicts itself. PASS_PENDING_BOARD means everything reachable without the
      assembled board was demonstrated and what remains is listed, each item naming
      the step that would close it -- on this project that is the ordinary outcome,
      not a failure.

      FAIL is narrower than it reads: the delivered change does not do what it
      promised, or a tick has no receipt at all. A miscounted figure is a warning, not
      a failure. The first change this document was run against had two wrong figures
      and behaved exactly as specified, and filing that under the same word as a change
      that bricked the board would throw away the distinction the line exists to carry.
      A verdict that always reads the same stops carrying information, which is how the
      README claim above survived.
    requires:
      - test-plan
      - tasks
      - review

apply:
  requires: [tasks, review]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.

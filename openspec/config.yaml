schema: spec-driven

# Project context. Shown to AI when creating artifacts. 50 KB limit.
context: |
  BoredomOS is the flight firmware of a CubeSat: Arduino UNO R4 Minima
  (Renesas RA4M1, Cortex-M4 at 48 MHz, 32 KB RAM) running FreeRTOS, built with
  PlatformIO. It presents itself to the ground station as a MAVLink vehicle over
  USB CDC at 115200; MAVProxy is the reference GCS. There are no control loops,
  no dynamic configuration, and no filesystem beyond a fixed ring of SD log files.

  Three documents divide the work, and a change should not blur them:
  - ARCHITECTURE.md is the single source of truth for the design — structure and
    why. Read it before proposing anything, and update it in the same change when
    it becomes inaccurate.
  - TODO.md is the backlog: what is planned but not yet built, one entry per
    feature or defect, in English, defined before any code is written.
  - openspec/ holds the change being implemented right now, and the specs that
    describe behaviour once it is archived.

  Hard constraints every proposal must respect:
  - About 2650 bytes of RAM headroom, out of 32 KB. Task stacks, control blocks and
    queue structures are static, in .bss, counted by the linker; a new task costs
    4 x stack_words + 76 bytes of it. configTOTAL_HEAP_SIZE is 0x1800 and backs the
    queued items only. The `RAM:` figure a build prints omits 9472 bytes and is not
    the commitment — scripts/ram_budget.py prints that, and fails the build before
    the headroom runs out. Adding a library or a task is a decision, not a detail.
  - Queues carry heap pointers, never values. The producer pvPortMallocs, checks
    the result for NULL, and vPortFrees if xQueueSend does not return pdPASS; the
    consumer frees after use. A leak is fatal within minutes.
  - Stack sizes in xTaskCreateStatic are words, not bytes, are tuned tight (96-256),
    and must match the length of the StackType_t array declared alongside.
  - Four priority levels, from include/Priority.h, never raw numbers.
  - Adding a subsystem is four edits: the task body in a new src/*.cpp reaching
    shared objects via extern, a [[noreturn]] extern declaration in src/main.cpp,
    its static storage beside it, and an xTaskCreateStatic in setup(). Tasks and
    queues are created nowhere else, and never with the dynamic xTaskCreate or
    xQueueCreate — CI greps src/ for both and fails.
  - One owner per resource: src/serial.cpp the UART, src/sdwrite.cpp the card,
    lib/SystemTime the clocks, lib/Battery the ADC. Everything else goes through a
    queue or the library wrapper — this is what makes the absence of mutexes safe.
  - Every outbound MAVLink message uses system id 1, MAV_COMP_ID_AUTOPILOT1,
    MAV_TYPE_ROCKET.
  - Wiring is hardcoded (SD CS on 9, battery on A0, DS1307 on I2C). A new pin must
    be documented in ARCHITECTURE.md.
  - configASSERT in setup() halts the board on a missing RTC, SD card, queue or
    task. Do not propose softening it into a degraded boot as a side effect.
  - A queue's declared depth must be backed by the heap: depth, plus one item block
    per producer that can be holding an unsent item and one per consumer holding an
    unreleased one. Proposing a depth is proposing that arithmetic.

  Verification: `pio run` is all that CI runs. There is no host or native test
  environment — test/test_main.cpp asserts against a real battery, a real DS1307
  and a real SD card, so `pio test` builds, flashes and runs on the board itself
  (about 25 s for the 5 cases) and cannot run in CI. Running it reflashes the
  board with the test binary and wipes data*.mpk and index.bin from the card, so
  it is not a read-only check. A change touching lib/ or a task body is not
  verified by building it; tasks must say which steps need the board.

# Per-artifact rules.
rules:
  proposal:
    - Any proposal that adds a task, a queue or a library must state its RAM cost
      against the RAM headroom, currently about 2650 bytes. A task costs
      4 x stack_words + 76 bytes of .bss; a queued item comes from the 0x1800 heap.
    - State explicitly when a change alters the MAVLink surface (new message id,
      new stream rate, changed identity triple).
    - Read the other active changes under openspec/changes/ before writing, not
      only openspec/specs/ and TODO.md. State which of their claims this change
      invalidates. One change landing first has already made another's entire RAM
      justification false and claimed a build flag that other one also claimed,
      and nothing detected it.

  specs:
    - Write each requirement as a standing property of the system, not as a
      statement about this change. A requirement phrased around "before and
      after" or "unchanged by the move" is meaningless once archived, and one has
      already had to be removed for exactly that.
    - Every scenario's THEN must name something someone could check. The observer
      is a ground station on the link, an operator with the board in hand, or the
      build -- one of those three. If none of them can see it, it is not a
      scenario.
    - A requirement that could stop being true without any of those three
      noticing is a build or configuration decision, not behaviour. It belongs in
      design.md.
    - Do not promise more than the toolchain delivers. A requirement about the
      build must be true of the build as it actually behaves, checked by running
      it, not as it ought to behave.

  design:
    - Name which file owns each resource the change touches, and keep it to one
      owner. Reaching a peripheral from a second file is what would force mutexes.
  tasks:
    - Mark every step that needs the assembled board. Without it the only checks
      that run are the CI ones -- `pio run` on the three environments, the grep
      that guards static creation, and `pio check`.
    - A change touching lib/ or a task body needs a `pio test` run and a look at
      the high-water marks in the SD log before it is called done.

# Advisory guidance, injected when these operations run.
operations:
  apply:
    guidance:
      - Never report a task body or a lib/ change as verified on the basis of a
        successful build. Say what was and was not run.
      - '`pio test` means the HIL suite: it flashes this firmware, interrogates it
        from the host and leaves the board running what it would fly. It does not
        touch the card. `pio test -e libs` is the destructive one -- it replaces
        the firmware with the Unity binary and deletes data*.mpk and index.bin on
        every case. Ask before running that one, and follow it with
        `pio run -t upload` to leave the board operational.'
  archive:
    guidance:
      - 'Before archiving, check the other active changes for claims this one
        makes false -- figures, build flags, the patterns their tasks follow.
        Nothing detects that automatically and it has already happened once.'
      - 'Update ARCHITECTURE.md in the same change when it becomes inaccurate.
        There is no TODO.md entry to close out: it was deleted when the change
        was proposed, and openspec/specs/ plus the git history are the record.'

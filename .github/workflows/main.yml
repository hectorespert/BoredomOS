name: BoredomOS CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache PlatformIO
      uses: actions/cache@v6
      with:
        path: ~/.platformio
        # hashFiles('**/lockfiles') hashed a file that has never existed in this
        # repo, so the key was a constant and the cache was never invalidated --
        # harmless while the toolchain never changed, silently stale once it does.
        key: ${{ runner.os }}-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-
    - name: Set up Python
      uses: actions/setup-python@v7
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
    - name: Static analysis
      # Reports defects without failing the job: pio check exits 0 unless
      # --fail-on-defect is passed. Tighten to --fail-on-defect=high once the
      # codebase has lived with the checker for a while.
      run: pio check
    - name: Kernel objects are created statically
      # Every kernel-object creation in src/ is now the ...Static form, so any
      # reappearance of the dynamic ones is a regression.
      run: |
        if grep -nE '\b(xTaskCreate|xQueueCreate)[[:space:]]*\(' src/ -r; then
          echo "::error::src/ must create tasks and queues with xTaskCreateStatic / xQueueCreateStatic"
          exit 1
        fi
    - name: Every queue item is carried by value
      # Widened from src/link.cpp and src/mavlink.cpp to all of src/ when the
      # DataFlash log took the heap pointer out of sdWriteQueue: src/logger.cpp and
      # src/sdwrite.cpp were the last two files that legitimately allocated, and
      # they no longer do. NOTHING in the firmware calls this now, which is what
      # lets the linker drop the FreeRTOS heap array entirely -- so a reappearance
      # here does not merely break a convention, it silently reintroduces a heap
      # that has no space reserved for it and whose first allocation fails.
      #
      # Note this is a TEXTUAL check: the token must not appear in src/ even in a
      # comment, which is why the files that discuss the rule describe it instead
      # of naming it.
      run: |
        if grep -rnE '\bpvPortMalloc\b' src/; then
          echo "::error::src/ carries queue items by value and must not allocate at run time"
          exit 1
        fi
    - name: Run PlatformIO
      # All three environments, not just the default. The RAM budget is only
      # policed in the configurations that are actually built, and
      # scripts/ram_budget.py runs after each link.
      run: pio run -e uno_r4_minima -e libs

name: BoredomOS CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache PlatformIO
      uses: actions/cache@v6
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
    - name: Set up Python
      uses: actions/setup-python@v7
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
    - name: Static analysis
      # Reports defects without failing the job: pio check exits 0 unless
      # --fail-on-defect is passed. Tighten to --fail-on-defect=high once the
      # codebase has lived with the checker for a while.
      run: pio check
    - name: Kernel objects are created statically
      # Every kernel-object creation in src/ is now the ...Static form, so any
      # reappearance of the dynamic ones is a regression. Says nothing about
      # pvPortMalloc, which still backs the queued items.
      run: |
        if grep -nE '\b(xTaskCreate|xQueueCreate)[[:space:]]*\(' src/ -r; then
          echo "::error::src/ must create tasks and queues with xTaskCreateStatic / xQueueCreateStatic"
          exit 1
        fi
    - name: Run PlatformIO
      # All three environments, not just the default. The RAM budget is only
      # policed in the configurations that are actually built, and
      # scripts/ram_budget.py runs after each link.
      run: pio run -e uno_r4_minima -e bench -e libs

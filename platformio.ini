; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
; Without this a bare `pio run`, `pio check` or `pio test` would process every
; environment -- flashing the bench build and then the Unity binary, erasing the SD
; card on the way. The default is the one that flies.
default_envs = uno_r4_minima

[env]
platform = renesas-ra
framework = arduino

[env:uno_r4_minima]
board = uno_r4_minima

lib_deps =
  adafruit/Adafruit BusIO
  Wire
  SPI
  adafruit/RTClib
  hectorespert/SolarCharger
  arduino-libraries/SD
  okalachev/MAVLink
  bblanchon/ArduinoJson

lib_ignore = TinyWireM

monitor_speed = 115200

; Reports the true RAM commitment after every link and fails while the numbers are
; still legible -- see scripts/ram_budget.py for why the linker's own diagnostic is
; not enough. custom_ram_min_headroom is the floor, in bytes.
extra_scripts = post:scripts/ram_budget.py
custom_ram_min_headroom = 1024

; `pio test` means the HIL suite: it flashes this firmware and then interrogates it
; from the host, leaving the board running what it would fly. The Unity suite is
; opt-in as `pio test -e libs`, because it replaces the firmware with a test binary
; and erases the SD card on every case.
;
; Note that a `test_*` subdirectory existing at all is what makes PlatformIO stop
; treating test/ itself as a suite -- test_names falls back to "*" only when there
; are none -- so both suites must live in their own directory or one silently stops
; running.
test_filter = test_hil
test_build_src = yes
test_testing_command =
  python
  ${platformio.test_dir}/test_hil/run.py

; The two MAVLink ports are named in include/Link.h: LINK_UART (Serial1 at
; LINK_BAUD, 57600) and LINK_USB (Serial, no line rate). Override the UART here,
; or per build, without touching any protocol code:
;   -D LINK_BAUD=115200
;   -D LINK_UART=Serial2
;
; -Wall and -Wextra: the tree builds clean under both. Measured 0 warnings across the
; whole build, dependencies included, and the firmware is byte-identical with and
; without them. They cost nothing today and catch the next regression instead of the
; next reader.
; WDT_TIMEOUT_MS is a deliberately short placeholder (add-degraded-mode task 4.1):
; it no longer has to cover the upload path (review.md finding 1 -- the DFU trigger
; jumps to the bootloader directly instead of relying on the watchdog), so the only
; constraint left is TaskSdWrite's worst case, measured on the board in task 4.6.
; Ceiling is 5.592 s; the RA4M1 WDT can express 70 discrete values between there and
; 5.33 us, so a requested figure that falls between two of them rounds up in
; src/main.cpp's selectWdtTiming().
; MAVLINK_COMM_NUM_BUFFERS defaults to 4: the library reserves a
; mavlink_message_t and a mavlink_status_t per channel whether or not the
; channel exists. It was 1 while this firmware parsed a single port.
; replace-console-cli-with-usb-mavlink-link raised it to 2, which is what
; src/link.cpp's two readers need -- LINK_CHAN_UART and LINK_CHAN_USB in
; include/Link.h. Measured with nm rather than estimated: the second channel
; costs 363 B (a 291 B m_mavlink_buffer plus 36 B of m_mavlink_status in each
; of the two translation units that call mavlink_get_channel_status), not the
; ~315 B an earlier version of this comment predicted from one status copy.
; Raising the channel count again means raising this in the same commit -- do
; not let two changes disagree about this value.
; configUSE_TIME_SLICING defaults to 0 in the framework's own FreeRTOSConfig.h --
; never a deliberate choice this project had made, just inherited. Set to 1
; (fold-periodic-telemetry-into-mavlink-task, found in Copilot's PR review):
; TaskMavlink joined TaskSerialWrite at PRIORITY_HIGH in this change, and
; xQueueReceive only yields the CPU when it genuinely blocks -- a sustained
; inbound stream keeps linkReadQueue non-empty and could let TaskMavlink run
; indefinitely without ever giving a link writer a turn, backing up that port's
; write queue until outbound telemetry is dropped. At configTICK_RATE_HZ
; = 1000 this round-robins same-priority ready tasks every 1 ms regardless of
; whether either yields voluntarily, closing that gap without touching
; src/mavlink.cpp. It is also what keeps the idle task -- and so the watchdog
; refresh in its hook -- scheduled against a same-priority task that spins. See design.md's
; "configUSE_TIME_SLICING moves from the framework's default of 0 to 1".
build_flags =
  -D INCLUDE_uxTaskGetStackHighWaterMark=1
  -D configCHECK_FOR_STACK_OVERFLOW=2
  -D configSUPPORT_STATIC_ALLOCATION=1
  -D configUSE_TIMERS=0
  -D configUSE_TIME_SLICING=1
  -D configUSE_TRACE_FACILITY=1
  -D configNUM_THREAD_LOCAL_STORAGE_POINTERS=0
  -D configQUEUE_REGISTRY_SIZE=0
  -D configTOTAL_HEAP_SIZE=0x200
  -D configUSE_MALLOC_FAILED_HOOK=1
  -D WDT_TIMEOUT_MS=1398
  -D MAVLINK_COMM_NUM_BUFFERS=2
  -Wall
  -Wextra

; Static analysis. Unscoped, cppcheck reports ~4800 defects, 4786 of them from
; .pio/libdeps -- 4584 from MAVLink's generated headers alone -- which drowns the
; ~12 from this project's own code. Scope it to what we can actually fix.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
  +<src/>
  +<include/>
  +<lib/>
; unusedFunction is wrong on every hit here: cppcheck sees one translation unit at a
; time, so it cannot tell that task bodies are reached through xTaskCreate function
; pointers, that setup()/loop() are called by the Arduino core, or that lib/ functions
; are used from another file.
check_flags =
  cppcheck: --suppress=unusedFunction --suppress=*:*/.pio/libdeps/*

; There used to be a [env:bench] here: the same firmware with the link moved onto
; USB CDC so the HIL suite could run without a USB-TTL adapter on D0/D1, with the
; CLI pushed onto Serial1 to make room. replace-console-cli-with-usb-mavlink-link
; retired it. USB carries MAVLink in every build now, so the whole suite reaches
; the flight build over the USB cable alone -- the override existed only to
; produce that, and there is nothing left for it to do. Nothing needs reflashing
; afterwards to restore the flight configuration either, because the suite never
; leaves it.

; The Unity library suite. Opt-in on purpose: it reflashes the board with a test
; binary and cleanSdFiles() deletes data*.mpk and index.bin on every case. It covers
; lib/ only -- test_build_src stays off, so src/ is not in the test binary and no
; task, queue or stack is observed.
[env:libs]
extends = env:uno_r4_minima

test_filter = test_libs
test_build_src = no
; `extends` inherits test_testing_command, which would make this environment run the
; HIL script instead of reading Unity output from the serial port. Clear it.
test_testing_command =

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env]
platform = renesas-ra
framework = arduino

[env:uno_r4_minima]
board = uno_r4_minima

lib_deps =
  adafruit/Adafruit BusIO
  Wire
  SPI
  adafruit/RTClib
  hectorespert/SolarCharger
  arduino-libraries/SD
  okalachev/MAVLink
  bblanchon/ArduinoJson

lib_ignore = TinyWireM

monitor_speed = 115200

build_flags =
  -D INCLUDE_uxTaskGetStackHighWaterMark=1
  -D configCHECK_FOR_STACK_OVERFLOW=2
; The tree builds clean under these: measured 0 warnings across the whole build,
; dependencies included, and the firmware is byte-identical with and without them.
; They cost nothing today and catch the next regression instead of the next reader.
  -Wall
  -Wextra
; The MAVLink link port and speed default to Serial1 at 57600 in include/Link.h.
; Override them here, or per build, without touching any protocol code:
;   -D LINK_BAUD=115200
;   -D LINK_SERIAL=Serial     ; puts the link back on USB CDC for bench work

; Static analysis. Unscoped, cppcheck reports ~4800 defects, 4786 of them from
; .pio/libdeps -- 4584 from MAVLink's generated headers alone -- which drowns the
; ~12 from this project's own code. Scope it to what we can actually fix.
check_tool = cppcheck, clangtidy
check_skip_packages = yes
check_src_filters =
  +<src/>
  +<include/>
  +<lib/>
; unusedFunction is wrong on every hit here: cppcheck sees one translation unit at a
; time, so it cannot tell that task bodies are reached through xTaskCreate function
; pointers, that setup()/loop() are called by the Arduino core, or that lib/ functions
; are used from another file.
check_flags =
  cppcheck: --suppress=unusedFunction --suppress=*:*/.pio/libdeps/*
; clang-tidy's default check set is LLVM house style -- trailing return types,
; magic numbers, uppercase literal suffixes, __llvm_libc namespaces -- and reports
; 248 defects here, none of them about this firmware. Enable only the families that
; look for defects. cert-err58-cpp is off because it warns about static constructors
; throwing, and this target has no exceptions.
  clangtidy: --checks=-*,bugprone-*,cert-*,clang-analyzer-*,-cert-err58-cpp
